name: deploy

on:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@v5.2.7
      - run: pnpm install --frozen-lockfile
      # GITHUB_TOKEN is set on the Worker in Cloudflare; deploys keep existing secrets.
      - run: pnpm deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PROFILE_USER: ${{ vars.PROFILE_USER }}
          PROFILE_DOMAIN: ${{ vars.PROFILE_DOMAIN }}
          # A secret, not a var, so the id is masked if cf prints a config diff.
          PROFILE_STATS_NAMESPACE_ID: ${{ secrets.PROFILE_STATS_NAMESPACE_ID }}
