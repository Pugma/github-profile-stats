name: format & lint

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@v5.2.3
      - run: pnpm install --frozen-lockfile
      - name: check formatting
        run: pnpm fmt
      - name: lint
        run: pnpm lint
